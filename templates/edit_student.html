{% extends "base.html" %}

{% block title %}
Edit Student | Library Management System
{% endblock %}

{% block page_heading %}
Edit Student
{% endblock %}

{% block content %}

<div class="welcome">

    <h1>✏️ Edit Student</h1>

    <p>
        Update the selected student's information.
    </p>

</div>


<div class="form-card">

    <form method="POST">


        <!-- Name -->

        <div class="form-group">

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ student['name'] }}"
                required>

        </div>


        <!-- Email -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                value="{{ student['email'] }}"
                required>

        </div>


        <!-- Phone -->

        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="text"
                name="phone"
                value="{{ student['phone'] or '' }}">

        </div>


        <!-- Course -->

        <div class="form-group">

            <label>
                Course
            </label>

            <input
                type="text"
                name="course"
                value="{{ student['course'] }}"
                required>

        </div>


        <!-- Buttons -->

        <button
            type="submit"
            class="btn">

            💾 Update Student

        </button>


        <a
            href="{{ url_for('students') }}"
            class="btn secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
