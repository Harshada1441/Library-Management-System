{% extends "base.html" %}

{% block title %}
Register Student | Library Management System
{% endblock %}

{% block page_heading %}
Register Student
{% endblock %}

{% block content %}

<div class="welcome">

    <h1>➕ Student Registration</h1>

    <p>
        Register a new student in the library system.
    </p>

</div>


<div class="form-card">

    <form method="POST">


        <!-- Name -->

        <div class="form-group">

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter student name"
                required>

        </div>


        <!-- Email -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter student email"
                required>

        </div>


        <!-- Phone -->

        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number">

        </div>


        <!-- Course -->

        <div class="form-group">

            <label>
                Course
            </label>

            <input
                type="text"
                name="course"
                placeholder="e.g. Computer Engineering"
                required>

        </div>


        <!-- Buttons -->

        <button
            type="submit"
            class="btn">

            👨‍🎓 Register Student

        </button>


        <a
            href="{{ url_for('students') }}"
            class="btn secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
